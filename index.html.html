
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>NIFTY 50 Market Dashboard</title>

<style>
*{
    box-sizing:border-box;
}

body{
    margin:0;
    background:#070b14;
    color:#eef3ff;
    font-family:Arial,Helvetica,sans-serif;
}

/* HEADER */

header{
    height:64px;
    background:#0e1524;
    border-bottom:1px solid #263149;

    display:flex;
    align-items:center;
    justify-content:space-between;

    padding:0 18px;

    position:sticky;
    top:0;
    z-index:100;
}

.logo{
    font-size:20px;
    font-weight:800;
}

.logo span{
    color:#38df86;
}

.status{
    color:#ffc857;
    font-size:12px;
}

/* TOOLBAR */

.toolbar{
    padding:12px;

    background:#0b1220;
    border-bottom:1px solid #202c40;

    display:flex;
    flex-wrap:wrap;
    gap:8px;
}

button{
    border:0;
    border-radius:7px;

    padding:9px 13px;

    background:#216cff;
    color:white;

    font-weight:bold;
    cursor:pointer;
}

button:hover{
    background:#1559d7;
}

.dark{
    background:#202d43;
}

.redbtn{
    background:#8b2431;
}

/* DASHBOARD */

.dashboard{
    padding:14px;

    display:grid;

    grid-template-columns:
    repeat(auto-fit,minmax(300px,1fr));

    gap:14px;
}

/* WINDOW */

.window{
    background:#101827;

    border:1px solid #27354d;

    border-radius:12px;

    overflow:hidden;

    box-shadow:
    0 8px 30px rgba(0,0,0,.25);
}

.window-head{
    height:46px;

    background:#172238;

    padding:0 12px;

    display:flex;

    align-items:center;

    justify-content:space-between;
}

.title{
    font-weight:800;
}

.close{
    background:#29364d;
    padding:4px 8px;
}

/* INDEX */

.index-body{
    padding:18px;
}

.price{
    font-size:36px;
    font-weight:800;
}

.change{
    margin-top:7px;
    font-size:17px;
    font-weight:700;
}

.green{
    color:#38df86;
}

.red{
    color:#ff596b;
}

.gray{
    color:#8491a7;
}

.time{
    margin-top:18px;
    color:#718097;
    font-size:11px;
}

/* HEATMAP */

.heatmap{
    padding:12px;

    display:grid;

    grid-template-columns:
    repeat(auto-fill,minmax(105px,1fr));

    gap:7px;
}

.stock{
    min-height:72px;

    padding:9px;

    border-radius:7px;

    display:flex;
    flex-direction:column;
    justify-content:space-between;

    cursor:pointer;

    transition:.15s;
}

.stock:hover{
    transform:scale(1.04);
}

.stock-name{
    font-size:12px;
    font-weight:700;
}

.stock-pct{
    font-size:15px;
    font-weight:800;
}

.g1{background:#0b5536}
.g2{background:#087244}
.g3{background:#069054}

.r1{background:#64212d}
.r2{background:#85202e}
.r3{background:#a51e2d}

.flat{
    background:#263247;
}

/* LIST */

.list{
    padding:8px 15px 15px;
}

.row{
    display:flex;
    justify-content:space-between;

    padding:10px 0;

    border-bottom:1px solid #222e42;
}

.row:last-child{
    border-bottom:0;
}

/* NIFTY TABLE */

.table-wrap{
    overflow:auto;
    max-height:420px;
}

table{
    width:100%;
    border-collapse:collapse;
}

th,td{
    padding:9px;
    border-bottom:1px solid #202d42;
    text-align:left;
    font-size:12px;
}

th{
    color:#8190a8;
    position:sticky;
    top:0;
    background:#101827;
}

/* IFRAME */

.iframe-box{
    padding:10px;
}

iframe{
    width:100%;
    height:520px;

    border:1px solid #29364d;
    border-radius:8px;

    background:#fff;
}

.iframe-note{
    color:#7e8ba1;
    font-size:11px;
    padding:8px;
}

/* FOOTER */

footer{
    padding:15px;

    text-align:center;

    color:#69778e;

    font-size:11px;

    border-top:1px solid #202c40;
}

/* MOBILE */

@media(max-width:600px){

    header{
        height:auto;
        min-height:64px;
        gap:10px;
    }

    .logo{
        font-size:16px;
    }

    .dashboard{
        grid-template-columns:1fr;
    }

}
</style>

</head>

<body>


<!-- HEADER -->

<header>

    <div class="logo">
        📊  <span>Market Movement</span>
    </div>

    <div
        id="status"
        class="status">

        ● MARKET DATA 

    </div>

</header>


<!-- TOOLBAR -->

<div class="toolbar">

    <button onclick="addIndex('NIFTY 50')">
        + NIFTY 50
    </button>

    <button onclick="addIndex('NIFTY BANK')">
        + NIFTY BANK
    </button>

    <button onclick="addHeatmap()">
        + viewrahul
    </button>

    <button onclick="addGainers()">
        + GAINERS
    </button>

    <button onclick="addLosers()">
        + LOSERS
    </button>

    <button onclick="addStocks()">
        + STOCKS
    </button>

    
         
    </button>

    <button
        class="dark"
        onclick="refreshData()">

        ↻ REFRESH

    </button>

</div>


<!-- DASHBOARD -->

<main
    id="dashboard"
    class="dashboard">
</main>


<footer>

    HELLO RAHUL. Market Movement Dashboard 
    use 
    Market @RAHUL

</footer>


<script>

/* =========================================================
   MARKET DATA STATE
========================================================= */

const market = {

    "NIFTY 50":{
        price:null,
        change:null,
        percent:null
    },

    "NIFTY BANK":{
        price:null,
        change:null,
        percent:null
    },

    "SENSEX":{
        price:null,
        change:null,
        percent:null
    }

};


/* =========================================================
   NIFTY 50 SYMBOL LIST
========================================================= */

const symbols = [

"ADANIENT",
"ADANIPORTS",
"APOLLOHOSP",
"ASIANPAINT",
"AXISBANK",
"BAJAJ-AUTO",
"BAJFINANCE",
"BAJAJFINSV",
"BEL",
"BHARTIARTL",
"CIPLA",
"COALINDIA",
"DRREDDY",
"EICHERMOT",
"ETERNAL",
"GRASIM",
"HCLTECH",
"HDFCBANK",
"HDFCLIFE",
"HEROMOTOCO",
"HINDALCO",
"HINDUNILVR",
"ICICIBANK",
"INDUSINDBK",
"INFY",
"ITC",
"JIOFIN",
"JSWSTEEL",
"KOTAKBANK",
"LT",
"M&M",
"MARUTI",
"MAXHEALTH",
"NTPC",
"NESTLEIND",
"ONGC",
"POWERGRID",
"RELIANCE",
"SBILIFE",
"SBIN",
"SHRIRAMFIN",
"SUNPHARMA",
"TATACONSUM",
"TATAMOTORS",
"TATASTEEL",
"TCS",
"TECHM",
"TITAN",
"TRENT",
"ULTRACEMCO",
"WIPRO"

];


/* =========================================================
   NUMBER FORMAT
========================================================= */

function fmt(value){

    if(
        value === null ||
        value === undefined ||
        isNaN(value)
    ){

        return "--";

    }

    return Number(value).toLocaleString(
        "en-IN",
        {
            minimumFractionDigits:2,
            maximumFractionDigits:2
        }
    );

}


/* =========================================================
   ADD INDEX WINDOW
========================================================= */

function addIndex(name){

    const dashboard =
        document.getElementById("dashboard");


    if(
        [...dashboard.children]
        .some(
            x => x.dataset.index === name
        )
    ){

        return;

    }


    const box =
        document.createElement("section");


    box.className="window";

    box.dataset.index=name;


    box.innerHTML=`

        <div class="window-head">

            <span class="title">
                ${name}
            </span>

            <button
                class="close"
                onclick="
                this.closest('.window').remove()
                ">

                ×

            </button>

        </div>


        <div class="index-body">

            <div
                class="price"
                data-price>

                --

            </div>


            <div
                class="change gray"
                data-change>

                Waiting for market data...

            </div>


            <div class="time">

                Last update:
                <span data-time>--</span>

            </div>

        </div>

    `;


    dashboard.appendChild(box);

    updateIndex(box);

}


/* =========================================================
   UPDATE INDEX
========================================================= */

function updateIndex(box){

    const name =
        box.dataset.index;

    const data =
        market[name];


    if(!data){

        return;

    }


    box.querySelector("[data-price]")
    .textContent =
    fmt(data.price);


    const change =
        Number(data.change || 0);

    const percent =
        Number(data.percent || 0);


    const element =
        box.querySelector("[data-change]");


    element.textContent=

        `${change>=0?"+":""}${fmt(change)}
        (${percent>=0?"+":""}${percent.toFixed(2)}%)`;


    element.className =
        "change " +

        (
            change>0
            ?"green"
            :
            change<0
            ?"red"
            :"gray"
        );


    box.querySelector("[data-time]")
    .textContent =
    new Date().toLocaleTimeString("en-IN");

}


/* =========================================================
   HEATMAP
========================================================= */

function addHeatmap(){

    if(
        document.querySelector("[data-heatmap]")
    ){

        return;

    }


    const box =
        document.createElement("section");


    box.className="window";

    box.dataset.heatmap="true";


    box.innerHTML=`

        <div class="window-head">

            <span class="title">
                NIFTY 50 
            </span>

            <button
                class="close"
                onclick="
                this.closest('.window').remove()
                ">

                ×

            </button>

        </div>


        <div
            id="heatmap"
            class="heatmap">

            Loading market data...

        </div>

    `;


    document
    .getElementById("dashboard")
    .appendChild(box);


    renderHeatmap();

}


/* =========================================================
   RENDER 
========================================================= */

function renderHeatmap(){

    const container =
        document.getElementById("heatmap");


    if(!container){

        return;

    }


    container.innerHTML="";


    symbols.forEach(symbol=>{

        const data =
            market[symbol] || {};


        const pct =
            Number(data.percent);


        let cls="flat";


        if(!isNaN(pct)){

            if(pct>=2)
                cls="g3";

            else if(pct>=0.75)
                cls="g2";

            else if(pct>0)
                cls="g1";

            else if(pct<=-2)
                cls="r3";

            else if(pct<=-0.75)
                cls="r2";

            else if(pct<0)
                cls="r1";

        }


        const cell =
            document.createElement("div");


        cell.className=
            "stock "+cls;


        cell.innerHTML=`

            <span class="stock-name">
                ${symbol}
            </span>

            <span class="stock-pct">

                ${
                    isNaN(pct)
                    ?"--"
                    :
                    (pct>=0?"+":"")+
                    pct.toFixed(2)+"%"
                }

            </span>

        `;


        container.appendChild(cell);

    });

}


/* =========================================================
   GAINERS
========================================================= */

function addGainers(){

    addMovementList(
        "TOP GAINERS",
        "gainers"
    );

}


/* =========================================================
   LOSERS
========================================================= */

function addLosers(){

    addMovementList(
        "TOP LOSERS",
        "losers"
    );

}


/* =========================================================
   MOVEMENT LIST
========================================================= */

function addMovementList(title,type){

    const box =
        document.createElement("section");


    box.className="window";

    box.dataset.listType=type;


    box.innerHTML=`

        <div class="window-head">

            <span class="title">
                ${title}
            </span>

            <button
                class="close"
                onclick="
                this.closest('.window').remove()
                ">

                ×

            </button>

        </div>


        <div
            class="list"
            data-list>

            Waiting for market data...

        </div>

    `;


    document
    .getElementById("dashboard")
    .appendChild(box);


    updateMovementList(
        box,
        type
    );

}


/* =========================================================
   UPDATE LIST
========================================================= */

function updateMovementList(box,type){

    const list =
        box.querySelector("[data-list]");


    const data =
        Object.entries(market)
        .filter(
            ([key,value]) =>
            value &&
            value.percent !== null
        )
        .map(
            ([symbol,value])=>({
                symbol,
                percent:Number(value.percent)
            })
        );


    data.sort(
        (a,b)=>
        b.percent-a.percent
    );


    if(type==="losers"){

        data.reverse();

    }


    const top =
        data.slice(0,10);


    if(!top.length){

        list.innerHTML =
        `<div class="gray">
            Waiting for market data...
        </div>`;

        return;

    }


    list.innerHTML =
    top.map(item=>`

        <div class="row">

            <span>
                ${item.symbol}
            </span>

            <span class="${
                item.percent>=0
                ?"green"
                :"red"
            }">

                ${item.percent>=0?"+":""}
                ${item.percent.toFixed(2)}%

            </span>

        </div>

    `).join("");

}


/* =========================================================
   STOCK TABLE
========================================================= */

function addStocks(){

    const box =
        document.createElement("section");


    box.className="window";


    box.innerHTML=`

        <div class="window-head">

            <span class="title">
                NIFTY 50 STOCKS
            </span>

            <button
                class="close"
                onclick="
                this.closest('.window').remove()
                ">

                ×

            </button>

        </div>


        <div class="table-wrap">

            <table>

                <thead>

                    <tr>

                        <th>Symbol</th>
                        <th>Price</th>
                        <th>Change</th>
                        <th>%</th>

                    </tr>

                </thead>

                <tbody id="stockTable">

                </tbody>

            </table>

        </div>

    `;


    document
    .getElementById("dashboard")
    .appendChild(box);


    renderStockTable();

}


/* =========================================================
   STOCK TABLE RENDER
========================================================= */

function renderStockTable(){

    const table =
        document.getElementById("stockTable");


    if(!table){

        return;

    }


    table.innerHTML =
    symbols.map(symbol=>{

        const data =
            market[symbol] || {};


        const price =
            data.price ?? null;

        const change =
            data.change ?? null;

        const pct =
            data.percent ?? null;


        return `

            <tr>

                <td>
                    ${symbol}
                </td>

                <td>
                    ${fmt(price)}
                </td>

                <td class="${
                    change>0
                    ?"green"
                    :
                    change<0
                    ?"red"
                    :"gray"
                }">

                    ${
                        change===null
                        ?"--"
                        :
                        (change>=0?"+":"")+
                        fmt(change)
                    }

                </td>

                <td class="${
                    pct>0
                    ?"green"
                    :
                    pct<0
                    ?"red"
                    :"gray"
                }">

                    ${
                        pct===null
                        ?"--"
                        :
                        (pct>=0?"+":"")+
                        Number(pct).toFixed(2)+
                        "%"
                    }

                </td>

            </tr>

        `;

    }).join("");

}


/* =========================================================
   OFFICIAL NSE HEATMAP
========================================================= */

function openNSE(){

    window.open(
        "https://www.nseindia.com/market-data/live-market-indices/heatmap",
        "_blank",
        "noopener,noreferrer"
    );

}


/* =========================================================
   DATA ADAPTER
========================================================= */

/*
   Yahan actual data source ka response
   dashboard format mein convert kiya ja sakta hai.

   Expected:

   {
      symbol:"RELIANCE",
      price:1400,
      change:20,
      percent:1.45
   }

   Important:

   HTML-only page NSE MCP ko directly
   authenticate/consume karne ke liye reliable
   backend replacement nahi hai.
*/

function receiveMarketData(data){

    if(!data){

        return;

    }


    if(data.indices){

        data.indices.forEach(item=>{

            market[item.symbol]=item;

        });

    }


    if(data.stocks){

        data.stocks.forEach(item=>{

            market[item.symbol]=item;

        });

    }


    document
    .querySelectorAll("[data-index]")
    .forEach(updateIndex);


    renderHeatmap();

    renderStockTable();


    document
    .querySelectorAll("[data-list-type]")
    .forEach(box=>{

        updateMovementList(
            box,
            box.dataset.listType
        );

    });


    if(data.freshness){

        document
        .getElementById("status")
        .textContent =
        "● NSE DATA • "+
        data.freshness;

    }

}


/* =========================================================
   REFRESH
========================================================= */

function refreshData(){

    document
    .getElementById("status")
    .textContent =
    "● DATA REFRESHING...";


    /*
       Yahan future API/MCP connector se
       receiveMarketData(data) call hoga.

       Example:

       fetch(...)
         .then(r=>r.json())
         .then(receiveMarketData)
    */


    setTimeout(()=>{

        document
        .getElementById("status")
        .textContent =
        "● MARKET DATA";

    },800);

}


/* =========================================================
   DEFAULT WINDOWS
========================================================= */

addIndex("NIFTY 50");

addIndex("NIFTY BANK");


addHeatmap();

addGainers();

addLosers();


</script>

</body>
</html>
